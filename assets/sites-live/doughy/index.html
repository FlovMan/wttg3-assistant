<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Index</title>
<style>
/***
    The new CSS reset - version 1.9 (last updated 19.6.2023)
    GitHub page: https://github.com/elad2412/the-new-css-reset
***/

/*
    Remove all the styles of the "User-Agent-Stylesheet", except for the 'display' property
    - The "symbol *" part is to solve Firefox SVG sprite bug
    - The "html" element is excluded, otherwise a bug in Chrome breaks the CSS hyphens property (https://github.com/elad2412/the-new-css-reset/issues/36)
 */
*:where(:not(html, iframe, canvas, img, svg, video, audio):not(svg *, symbol *)) {
    all: unset;
    display: revert;
}

/* Preferred box-sizing value */
*,
*::before,
*::after {
    box-sizing: border-box;
}

/* Reapply the pointer cursor for anchor tags */
a, button {
    cursor: revert;
}

/* Remove list styles (bullets/numbers) */
ol, ul, menu {
    list-style: none;
}

/* For images to not be able to exceed their container */
img {
    max-inline-size: 100%;
    max-block-size: 100%;
}

/* removes spacing between cells in tables */
table {
    border-collapse: collapse;
}

/* Safari - solving issue when using user-select:none on the <body> text input doesn't working */
input, textarea {
    -webkit-user-select: auto;
}

/* revert the 'white-space' property for textarea elements on Safari */
textarea {
    white-space: revert;
}

/* minimum style to allow to style meter element */
meter {
    -webkit-appearance: revert;
    appearance: revert;
}

/* preformatted text - use only for this feature */
:where(pre) {
    all: revert;
}

/* reset default text opacity of input placeholder */
::placeholder {
    color: unset;
}

/* remove default dot (•) sign */
::marker {
    content: initial;
}

/* fix the feature of 'hidden' attribute.
   display:revert; revert to element instead of attribute */
:where([hidden]) {
    display: none;
}

/* revert for bug in Chromium browsers
   - fix for the content editable attribute will work properly.
   - webkit-user-select: auto; added for Safari in case of using user-select:none on wrapper element*/
:where([contenteditable]:not([contenteditable="false"])) {
    -moz-user-modify: read-write;
    -webkit-user-modify: read-write;
    overflow-wrap: break-word;
    -webkit-line-break: after-white-space;
    -webkit-user-select: auto;
}

/* apply back the draggable feature - exist only in Chromium and Safari */
:where([draggable="true"]) {
    -webkit-user-drag: element;
}

/* Revert Modal native behavior */
:where(dialog:modal) {
    all: revert;
}

a{
    cursor: pointer;
}

a.CFTAG, a.CPTAG{
    cursor: inherit;
}

a.CFTAG img, a.CPTAG img{
    cursor: default;
}

.TagHoverShow{
    cursor: pointer !important;
}

.TagHoverShow img{
    cursor: pointer !important;
}
body {
  font-family: Arial, sans-serif;
  background-repeat: no-repeat;
  background-color: #faa5f5;
  padding: 0px;
  margin: 0;
  overflow-x: hidden;
}

.collection {
  display: block;
  margin-left: auto;
  margin-right: auto;
  width: 50%;
}

img {
  max-width: 100%;
  height: auto;
  position: absolute;
  left: 0px;
  top: 0px;
  z-index: -1;
}

video {
  max-width: 100%;
  height: auto;
  position: absolute;
  left: 0px;
  top: 0px;
  z-index: -1;
}

.title {
  position: fixed;
  top: 300px;
  text-align: center;
  max-width: 100%;
  width: 100%;
  z-index: 2;
}

#img1 {

}

#img2 {
  left: 35%;
}

#img3 {
  top: 40%;
  z-index: -2;
}

#img4 {
  top: 30%;
  left: 60%;
  z-index: -1;
}

#img5 {
  top: 80%;
  left: 10%;
  scale: 1.4;
  z-index: -3;
}

#img6 {
  top: 50%;
  left: 45%;
  z-index: -4;
}

#img7 {
  top: 95%;
  left: 70%;
  scale: 1.4;
  z-index: -4;
}

#img8 {
  top: 110%;
  scale: 1.15;
  z-index: -2;
}

#img9 {
  top: 150%;
  z-index: -5;
}

#img10 {
  top: 140%;
  left: 50%;
  z-index: -4;
}

#img11 {
  top: 140%;
  left: 25%;
  scale: 2;
  z-index: -6;
}

.PTAG {
    color: #e87dc8; /* change from ed98d3 -> e87dc8 */
    font-size: 0.9em;
    white-space: nowrap;
}

.PTAG.front {
  color: #af6a93; /* change from bf88a9 -> af6a93 */
  writing-mode: vertical-lr;
  text-orientation: upright;
  position: fixed;
  width: 100%;
  height: 136px;
  top: 300px;
  left: -14px;
  scale: 0.9;
  z-index: 6;
}

.PTAG.void {
  color: #f075e6; /* change from f095e9 -> f075e6 */
  position: absolute;
  top: 1900px;
  left: 40%;
  scale: 1.4;
  opacity: 0.9;
  z-index: 1;
  transform: rotate(-45deg);
}

.PTAG.dark {
  color: #efa9ea; /* change from f5c9f2 -> efa9ea */
  position: absolute;
  top: 1400px;
  left: 85%;
  text-shadow: 2px -1px 2px #ca4ec2; /* change d87cd2 -> ca4ec2 */
  z-index: 1;
  transform: rotate(60deg);
}
